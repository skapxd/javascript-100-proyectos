name: Playwright Tests
on:
  push:
    branches: [ main, master, "**" ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    # runs-on: self-hosted
    runs-on: ubuntu-20.04
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: yarn

    - name: Run Playwright tests
      run: yarn test:compare

    - uses: vimtor/action-zip@v1.2
      with:
        files: playwright-report
        dest: playwright-report.zip

    - name: Send Playwright Report to Web
      if: ${{ always() }}
      run: | 
        curl -X 'POST' \
        'https://test-result-view.skapxd.dev/view' \
        -H 'accept: */*' \
        -H 'Content-Type: multipart/form-data' \
        -F 'file=@playwright-report.zip;type=application/zip'

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
